version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing project dependencies...
  build:
    commands:
      - echo Build started on `date`
      - echo Compiling and testing project files...
  post_build:
    commands:
      - echo Build completed successfully on `date`

artifacts:
  files:
    - '**/*'